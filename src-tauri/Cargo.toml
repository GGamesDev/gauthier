[package]
name = "gauthier"
version = "0.1.0"
description = "Gauthier: a simple Rust IDE for your computer and the Raspberry Pi Pico"
edition = "2024"
authors = ["GGamesDev"]
license = "MIT"
repository = "https://github.com/GGamesDev/gauthier"

[lib]
name = "gauthier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", features = ["usbportinfo-interface"] }
ureq = { version = "3", features = ["json"] }
dirs = "6"
trash = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
